[project]
name = "docchat-sidecar"
version = "0.0.1"
description = "DocChat sidecar - FastAPI WebSocket agent loop. Spawned by the VS Code extension."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashwin Ugale", email = "ugaleashwin@gmail.com" }]
keywords = ["llm", "rag", "vscode", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The two portfolio libraries the sidecar dogfoods.
    "smolAmem>=1.0",
    "toolpicker>=1.0",
    # FastAPI + uvicorn for the WebSocket endpoint.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # OpenAI for embeddings + chat completions.
    "openai>=1.40",
    # Vector store client.
    "qdrant-client>=1.12",
    # HTML/Markdown parsing for the doc indexer.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # .env loading.
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docchat_sidecar"]

# ---------------------------------------------------------------------------
# uv: dev dependencies live in a separate group so end-users never install them.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # WebSocket client for tests that exercise the FastAPI endpoint.
    "websockets>=13.0",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff: same opinionated baseline as the portfolio libraries.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line-too-long - formatter handles it
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "live_subprocess: spawns the real sidecar subprocess (slower; skip on flaky CI runners)",
]

# ---------------------------------------------------------------------------
# Mypy: strict for our own code, lenient at the edges.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "dotenv",
    "qdrant_client",
    "qdrant_client.*",
    "bs4",
]
ignore_missing_imports = true
