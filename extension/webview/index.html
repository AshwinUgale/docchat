<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ws://localhost:* http://localhost:*;" />
  <title>DocChat</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: var(--vscode-font-family, "Segoe UI", system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    #status {
      font-size: 0.85em;
      font-weight: normal;
      opacity: 0.7;
    }
    #status.ok { color: var(--vscode-testing-iconPassed, #3fb950); opacity: 1; }
    #status.err { color: var(--vscode-testing-iconFailed, #f85149); opacity: 1; }
    #indexBtn {
      padding: 3px 10px;
      font-size: 0.85em;
      background: transparent;
      color: var(--vscode-button-foreground, inherit);
      border: 1px solid var(--vscode-button-border, var(--vscode-button-background, #0e639c));
      border-radius: 4px;
      cursor: pointer;
    }
    #indexBtn:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); color: #fff; }
    #indexBtn:disabled { opacity: 0.4; cursor: default; }
    #progressBar {
      height: 3px;
      background: var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
      overflow: hidden;
      display: none;
    }
    #progressBar.active { display: block; }
    #progressFill {
      height: 100%;
      width: 0%;
      background: var(--vscode-progressBar-background, #0e639c);
      transition: width 0.2s ease-out;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 6px;
      max-width: 90%;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--vscode-textCodeBlock-background, rgba(128, 128, 128, 0.15));
    }
    .msg.system {
      align-self: center;
      font-style: italic;
      opacity: 0.7;
      font-size: 0.9em;
    }
    .msg.error {
      align-self: center;
      background: var(--vscode-inputValidation-errorBackground, rgba(248, 81, 73, 0.15));
      color: var(--vscode-inputValidation-errorForeground, #f85149);
      border: 1px solid var(--vscode-inputValidation-errorBorder, #f85149);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
    }
    input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--vscode-input-border, rgba(128, 128, 128, 0.35));
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border-radius: 4px;
      font: inherit;
    }
    input:focus {
      outline: 1px solid var(--vscode-focusBorder, #0e639c);
      outline-offset: -1px;
    }
    input:disabled { opacity: 0.5; }
    button {
      padding: 6px 14px;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    button:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); }
    button:disabled { opacity: 0.5; cursor: default; }
    /* v0.7.1 — clickable citation chips in the streaming-final footer */
    .cite-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cite-chip {
      font-size: 0.78em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--vscode-button-border, var(--vscode-button-background, #0e639c));
      background: transparent;
      color: var(--vscode-textLink-foreground, var(--vscode-button-foreground, inherit));
      cursor: pointer;
      font-family: var(--vscode-editor-font-family, ui-monospace, monospace);
    }
    .cite-chip:hover { background: var(--vscode-button-hoverBackground, #1177bb); color: #fff; }
    .cite-chip[disabled] { opacity: 0.5; cursor: not-allowed; }
    /* v0.7.1 — gear icon + collapsible settings drawer */
    #gearBtn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--vscode-foreground);
      font-size: 1em;
      padding: 0 4px;
      opacity: 0.7;
    }
    #gearBtn:hover { opacity: 1; }
    #settings {
      display: none;
      padding: 10px 12px;
      gap: 10px;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
      background: var(--vscode-sideBar-background, rgba(128, 128, 128, 0.07));
      font-size: 0.9em;
    }
    #settings.active { display: flex; flex-direction: column; }
    #settings label {
      display: flex; align-items: center; gap: 10px; justify-content: space-between;
    }
    #settings input[type="range"] { flex: 1; }
    #settings select {
      padding: 3px 6px;
      background: var(--vscode-dropdown-background, var(--vscode-input-background));
      color: var(--vscode-dropdown-foreground, var(--vscode-input-foreground));
      border: 1px solid var(--vscode-dropdown-border, var(--vscode-input-border, rgba(128, 128, 128, 0.35)));
      border-radius: 3px;
    }
    .setting-value { font-family: var(--vscode-editor-font-family, ui-monospace, monospace); opacity: 0.8; min-width: 4ch; text-align: right; }
  </style>
</head>
<body>
  <header>
    <span>DocChat <span style="opacity: 0.6;">v0.7.1</span></span>
    <span style="display: flex; align-items: center; gap: 10px;">
      <button id="indexBtn" type="button" disabled>Index React 18.2</button>
      <button id="gearBtn" type="button" title="Settings" aria-label="Settings">⚙</button>
      <span id="status">connecting…</span>
    </span>
  </header>
  <div id="settings" aria-hidden="true">
    <label>
      <span>Chat model</span>
      <select id="settingChatModel">
        <option value="gpt-4o-mini">gpt-4o-mini (default, cheap)</option>
        <option value="gpt-4o">gpt-4o (slower, sharper)</option>
      </select>
    </label>
    <label>
      <span>Retrieval floor</span>
      <input id="settingFloor" type="range" min="0.05" max="0.40" step="0.01" value="0.15" />
      <span class="setting-value" id="settingFloorValue">0.15</span>
    </label>
    <label>
      <span>Max iterations</span>
      <input id="settingMaxIter" type="range" min="1" max="5" step="1" value="3" />
      <span class="setting-value" id="settingMaxIterValue">3</span>
    </label>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="log">
    <div class="msg system">Waiting for sidecar port from extension…</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about a library at your pinned version…" autocomplete="off" disabled />
    <button id="send" type="submit" disabled>Send</button>
  </form>

  <script>
    // v0.7.1 — vscode webview API for postMessage to the extension (used
    // for click-to-open citation handling). Guarded for the test-host
    // case where the webview is loaded outside VS Code.
    const vscode = (typeof acquireVsCodeApi === "function") ? acquireVsCodeApi() : null;

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const indexBtn = document.getElementById("indexBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const gearBtn = document.getElementById("gearBtn");
    const settingsPanel = document.getElementById("settings");
    const settingChatModel = document.getElementById("settingChatModel");
    const settingFloor = document.getElementById("settingFloor");
    const settingFloorValue = document.getElementById("settingFloorValue");
    const settingMaxIter = document.getElementById("settingMaxIter");
    const settingMaxIterValue = document.getElementById("settingMaxIterValue");

    let ws = null;
    let indexing = false;
    // v0.7: while a stream is in progress, all assistant_text_delta frames
    // append to this same bubble. Reset on assistant_stream_final or on
    // the start of a new user message.
    let activeStreamBubble = null;

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function appendStreamDelta(text) {
      if (!activeStreamBubble) {
        activeStreamBubble = append("bot", "");
      }
      activeStreamBubble.textContent += text;
      log.scrollTop = log.scrollHeight;
    }

    function finalizeStream(final) {
      // The bubble already has the full text streamed in. Add a footer
      // with iteration/tool telemetry + (v0.7.1) clickable citation chips
      // that postMessage to the extension to open the source URL.
      if (!activeStreamBubble) {
        // The agent returned a final without any deltas (e.g. iteration
        // cap with no content). Create a bubble for the footer.
        activeStreamBubble = append("bot", "");
      }
      const citations = Array.isArray(final.citations) ? final.citations : [];
      const footer = document.createElement("div");
      footer.style.fontSize = "0.8em";
      footer.style.opacity = "0.6";
      footer.style.marginTop = "6px";
      const iterPart = `${final.iterations} iteration${final.iterations === 1 ? "" : "s"}`;
      const toolPart = `via ${final.tool_used}`;
      const citePart = citations.length > 0
        ? `, ${citations.length} citation${citations.length === 1 ? "" : "s"}`
        : "";
      footer.textContent = `— ${iterPart}, ${toolPart}${citePart}`;
      activeStreamBubble.appendChild(footer);
      if (citations.length > 0) {
        const row = document.createElement("div");
        row.className = "cite-row";
        for (const c of citations) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "cite-chip";
          chip.textContent = `${c.library}@${c.version}:${c.source}`;
          if (c.source_url) {
            chip.title = c.source_url;
            chip.addEventListener("click", () => openCitation(c));
          } else {
            chip.disabled = true;
            chip.title = "No source URL available for this citation.";
          }
          row.appendChild(chip);
        }
        activeStreamBubble.appendChild(row);
      }
      activeStreamBubble = null;
      log.scrollTop = log.scrollHeight;
    }

    function openCitation(c) {
      // v0.7.1 — click-to-open. The extension owns vscode.env.openExternal;
      // we just post the structured citation and let it decide what to open.
      if (!vscode) return;
      vscode.postMessage({
        type: "openCitation",
        library: c.library,
        version: c.version,
        source: c.source,
        source_url: c.source_url || null,
      });
    }

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || "";
    }

    function enableChat(enabled) {
      input.disabled = !enabled;
      sendBtn.disabled = !enabled;
      indexBtn.disabled = !enabled || indexing;
      if (enabled) input.focus();
    }

    function setProgress(done, total) {
      if (total == null) {
        progressBar.classList.add("active");
        progressFill.style.width = "5%";
        return;
      }
      progressBar.classList.add("active");
      const pct = Math.min(100, Math.round((done / total) * 100));
      progressFill.style.width = pct + "%";
    }

    function hideProgress() {
      progressBar.classList.remove("active");
      progressFill.style.width = "0%";
    }

    function handleServerMessage(msg) {
      switch (msg.type) {
        case "assistant_text":
          // Non-streaming path (errors, simple replies). If a stream is
          // in flight when this lands, close it out first so the next
          // bubble starts clean.
          if (activeStreamBubble) {
            activeStreamBubble = null;
          }
          append("bot", msg.text);
          break;
        case "assistant_text_delta":
          appendStreamDelta(msg.text);
          break;
        case "assistant_stream_final":
          finalizeStream(msg);
          break;
        case "index_progress": {
          if (!indexing) {
            indexing = true;
            indexBtn.disabled = true;
            append("system", `Indexing ${msg.library}@${msg.version}…`);
          }
          setProgress(msg.chunks_done, msg.chunks_total);
          if (msg.note) {
            // Don't spam the log with every fetch line; just update status text.
            setStatus(msg.note, "ok");
          }
          break;
        }
        case "index_complete":
          indexing = false;
          hideProgress();
          setStatus("connected", "ok");
          append("system", `Indexed ${msg.chunks_indexed} chunks for ${msg.library}@${msg.version}.`);
          indexBtn.disabled = false;
          break;
        case "index_error":
          indexing = false;
          hideProgress();
          setStatus("error", "err");
          append("error", `Indexing ${msg.library}@${msg.version} failed: ${msg.message}`);
          indexBtn.disabled = false;
          break;
        case "pong":
          // Could surface sidecar version here for drift detection.
          break;
        default:
          append("system", `Unknown server message: ${JSON.stringify(msg)}`);
      }
    }

    function connect(port, token) {
      append("system", `Opening WebSocket on ws://localhost:${port}/chat`);
      // The sidecar requires the per-spawn token the extension generated and
      // handed us via postMessage; without it the handshake is rejected.
      const query = token ? `?token=${encodeURIComponent(token)}` : "";
      const socket = new WebSocket(`ws://localhost:${port}/chat${query}`);
      socket.addEventListener("open", () => {
        setStatus("connected", "ok");
        append("system", "Connected. Type a message or click 'Index React 18.2' to populate the docs collection.");
        enableChat(true);
      });
      socket.addEventListener("message", (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleServerMessage(msg);
        } catch (err) {
          append("error", `Failed to parse server message: ${err}`);
        }
      });
      socket.addEventListener("close", (event) => {
        setStatus("disconnected", "err");
        append("system", `Connection closed (code ${event.code}).`);
        enableChat(false);
      });
      socket.addEventListener("error", () => {
        setStatus("error", "err");
        append("system", "Connection error — check sidecar logs.");
        enableChat(false);
      });
      ws = socket;
    }

    function send(msg) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(msg));
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg && msg.type === "sidecarPort" && typeof msg.port === "number") {
        connect(msg.port, typeof msg.token === "string" ? msg.token : undefined);
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      // Reset stream bubble tracker so the next agent response starts fresh.
      activeStreamBubble = null;
      append("user", text);
      send({ type: "user_query", text });
      input.value = "";
    });

    indexBtn.addEventListener("click", () => {
      if (indexing) return;
      send({ type: "index_library", library: "react", version: "18.2.0" });
    });

    // v0.7.1 — settings drawer
    gearBtn.addEventListener("click", () => {
      const open = settingsPanel.classList.toggle("active");
      settingsPanel.setAttribute("aria-hidden", String(!open));
    });

    settingChatModel.addEventListener("change", () => {
      send({ type: "settings_update", chat_model: settingChatModel.value });
    });
    settingFloor.addEventListener("input", () => {
      settingFloorValue.textContent = settingFloor.value;
    });
    settingFloor.addEventListener("change", () => {
      send({ type: "settings_update", score_floor: parseFloat(settingFloor.value) });
    });
    settingMaxIter.addEventListener("input", () => {
      settingMaxIterValue.textContent = settingMaxIter.value;
    });
    settingMaxIter.addEventListener("change", () => {
      send({ type: "settings_update", max_iterations: parseInt(settingMaxIter.value, 10) });
    });
  </script>
</body>
</html>
