<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ws://localhost:* http://localhost:*;" />
  <title>DocChat</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: var(--vscode-font-family, "Segoe UI", system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    #status {
      font-size: 0.85em;
      font-weight: normal;
      opacity: 0.7;
    }
    #status.ok { color: var(--vscode-testing-iconPassed, #3fb950); opacity: 1; }
    #status.err { color: var(--vscode-testing-iconFailed, #f85149); opacity: 1; }
    #indexBtn {
      padding: 3px 10px;
      font-size: 0.85em;
      background: transparent;
      color: var(--vscode-button-foreground, inherit);
      border: 1px solid var(--vscode-button-border, var(--vscode-button-background, #0e639c));
      border-radius: 4px;
      cursor: pointer;
    }
    #indexBtn:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); color: #fff; }
    #indexBtn:disabled { opacity: 0.4; cursor: default; }
    #progressBar {
      height: 3px;
      background: var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
      overflow: hidden;
      display: none;
    }
    #progressBar.active { display: block; }
    #progressFill {
      height: 100%;
      width: 0%;
      background: var(--vscode-progressBar-background, #0e639c);
      transition: width 0.2s ease-out;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 6px;
      max-width: 90%;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--vscode-textCodeBlock-background, rgba(128, 128, 128, 0.15));
    }
    .msg.system {
      align-self: center;
      font-style: italic;
      opacity: 0.7;
      font-size: 0.9em;
    }
    .msg.error {
      align-self: center;
      background: var(--vscode-inputValidation-errorBackground, rgba(248, 81, 73, 0.15));
      color: var(--vscode-inputValidation-errorForeground, #f85149);
      border: 1px solid var(--vscode-inputValidation-errorBorder, #f85149);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.35));
    }
    input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--vscode-input-border, rgba(128, 128, 128, 0.35));
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border-radius: 4px;
      font: inherit;
    }
    input:focus {
      outline: 1px solid var(--vscode-focusBorder, #0e639c);
      outline-offset: -1px;
    }
    input:disabled { opacity: 0.5; }
    button {
      padding: 6px 14px;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    button:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span>DocChat <span style="opacity: 0.6;">v0.7</span></span>
    <span style="display: flex; align-items: center; gap: 10px;">
      <button id="indexBtn" type="button" disabled>Index React 18.2</button>
      <span id="status">connecting…</span>
    </span>
  </header>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="log">
    <div class="msg system">Waiting for sidecar port from extension…</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about a library at your pinned version…" autocomplete="off" disabled />
    <button id="send" type="submit" disabled>Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const indexBtn = document.getElementById("indexBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");

    let ws = null;
    let indexing = false;
    // v0.7: while a stream is in progress, all assistant_text_delta frames
    // append to this same bubble. Reset on assistant_stream_final or on
    // the start of a new user message.
    let activeStreamBubble = null;

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function appendStreamDelta(text) {
      if (!activeStreamBubble) {
        activeStreamBubble = append("bot", "");
      }
      activeStreamBubble.textContent += text;
      log.scrollTop = log.scrollHeight;
    }

    function finalizeStream(final) {
      // The bubble already has the full text streamed in. Add a small
      // footer with the tool used + iteration count so the demo surfaces
      // the agent's actual path. v0.7.1 will render citations as
      // clickable spans that open the source URL in the browser.
      if (!activeStreamBubble) {
        // The agent returned a final without any deltas (e.g. iteration
        // cap with no content). Create a bubble for the footer.
        activeStreamBubble = append("bot", "");
      }
      const footer = document.createElement("div");
      footer.style.fontSize = "0.8em";
      footer.style.opacity = "0.6";
      footer.style.marginTop = "6px";
      const citeCount = final.citations ? final.citations.length : 0;
      const iterPart = `${final.iterations} iteration${final.iterations === 1 ? "" : "s"}`;
      const toolPart = `via ${final.tool_used}`;
      const citePart = citeCount > 0 ? `, ${citeCount} citation${citeCount === 1 ? "" : "s"}` : "";
      footer.textContent = `— ${iterPart}, ${toolPart}${citePart}`;
      activeStreamBubble.appendChild(footer);
      activeStreamBubble = null;
      log.scrollTop = log.scrollHeight;
    }

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || "";
    }

    function enableChat(enabled) {
      input.disabled = !enabled;
      sendBtn.disabled = !enabled;
      indexBtn.disabled = !enabled || indexing;
      if (enabled) input.focus();
    }

    function setProgress(done, total) {
      if (total == null) {
        progressBar.classList.add("active");
        progressFill.style.width = "5%";
        return;
      }
      progressBar.classList.add("active");
      const pct = Math.min(100, Math.round((done / total) * 100));
      progressFill.style.width = pct + "%";
    }

    function hideProgress() {
      progressBar.classList.remove("active");
      progressFill.style.width = "0%";
    }

    function handleServerMessage(msg) {
      switch (msg.type) {
        case "assistant_text":
          // Non-streaming path (errors, simple replies). If a stream is
          // in flight when this lands, close it out first so the next
          // bubble starts clean.
          if (activeStreamBubble) {
            activeStreamBubble = null;
          }
          append("bot", msg.text);
          break;
        case "assistant_text_delta":
          appendStreamDelta(msg.text);
          break;
        case "assistant_stream_final":
          finalizeStream(msg);
          break;
        case "index_progress": {
          if (!indexing) {
            indexing = true;
            indexBtn.disabled = true;
            append("system", `Indexing ${msg.library}@${msg.version}…`);
          }
          setProgress(msg.chunks_done, msg.chunks_total);
          if (msg.note) {
            // Don't spam the log with every fetch line; just update status text.
            setStatus(msg.note, "ok");
          }
          break;
        }
        case "index_complete":
          indexing = false;
          hideProgress();
          setStatus("connected", "ok");
          append("system", `Indexed ${msg.chunks_indexed} chunks for ${msg.library}@${msg.version}.`);
          indexBtn.disabled = false;
          break;
        case "index_error":
          indexing = false;
          hideProgress();
          setStatus("error", "err");
          append("error", `Indexing ${msg.library}@${msg.version} failed: ${msg.message}`);
          indexBtn.disabled = false;
          break;
        case "pong":
          // Could surface sidecar version here for drift detection.
          break;
        default:
          append("system", `Unknown server message: ${JSON.stringify(msg)}`);
      }
    }

    function connect(port) {
      append("system", `Opening WebSocket on ws://localhost:${port}/chat`);
      const socket = new WebSocket(`ws://localhost:${port}/chat`);
      socket.addEventListener("open", () => {
        setStatus("connected", "ok");
        append("system", "Connected. Type a message or click 'Index React 18.2' to populate the docs collection.");
        enableChat(true);
      });
      socket.addEventListener("message", (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleServerMessage(msg);
        } catch (err) {
          append("error", `Failed to parse server message: ${err}`);
        }
      });
      socket.addEventListener("close", (event) => {
        setStatus("disconnected", "err");
        append("system", `Connection closed (code ${event.code}).`);
        enableChat(false);
      });
      socket.addEventListener("error", () => {
        setStatus("error", "err");
        append("system", "Connection error — check sidecar logs.");
        enableChat(false);
      });
      ws = socket;
    }

    function send(msg) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(msg));
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg && msg.type === "sidecarPort" && typeof msg.port === "number") {
        connect(msg.port);
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      // Reset stream bubble tracker so the next agent response starts fresh.
      activeStreamBubble = null;
      append("user", text);
      send({ type: "user_query", text });
      input.value = "";
    });

    indexBtn.addEventListener("click", () => {
      if (indexing) return;
      send({ type: "index_library", library: "react", version: "18.2.0" });
    });
  </script>
</body>
</html>
