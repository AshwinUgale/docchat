[pytest]
# Same shape as sidecar/pyproject.toml's [tool.pytest.ini_options] - async
# def tests should run automatically without per-test @pytest.mark.asyncio
# decorators. The eval suite has more async test cases than sync ones so
# auto mode wins on signal-to-noise.
minversion = 8.0
asyncio_mode = auto
addopts = -ra --strict-markers --strict-config
testpaths = tests
